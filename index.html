<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1f1f1f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Hermes - Audio & Transcripcion</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Estilos globales y reset basico para Dark Mode */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      width: 100%;
      max-width: 600px;
      text-align: center;
      padding-bottom: 20px;
      border-bottom: 1px solid #2a2a2a;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: #ffffff;
    }

    main {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Modulo de Controles */
    .controls-card {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .btn-group {
      display: flex;
      gap: 15px;
      width: 100%;
    }

    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, opacity 0.2s ease;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-record {
      background-color: #cf6679;
      color: #000000;
    }

    .btn-record.recording {
      background-color: #ff1744;
      color: #ffffff;
      animation: pulse 1.5s infinite;
    }

    .btn-stop {
      background-color: #03dac6;
      color: #000000;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    /* Caja de transcripcion en tiempo real */
    .transcription-box {
      width: 100%;
      min-height: 100px;
      max-height: 150px;
      background-color: #121212;
      border: 1px solid #333333;
      border-radius: 8px;
      padding: 12px;
      overflow-y: auto;
      font-size: 0.95rem;
      line-height: 1.4;
      color: #b0b0b0;
    }

    /* Listado CRUD de Grabaciones */
    .list-container {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .list-container h2 {
      font-size: 1.2rem;
      margin-bottom: 15px;
      color: #ffffff;
    }

    .recordings-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .recording-item {
      background-color: #252525;
      border: 1px solid #333333;
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .recording-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: #888888;
    }

    .recording-transcript {
      font-size: 0.95rem;
      color: #dddddd;
      background-color: #1a1a1a;
      padding: 8px;
      border-radius: 4px;
      border-left: 3px solid #03dac6;
    }

    audio {
      width: 100%;
      height: 40px;
      margin-top: 5px;
    }

    .item-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn-delete {
      background-color: #331518;
      color: #cf6679;
      border: 1px solid #cf6679;
      padding: 6px 12px;
      font-size: 0.85rem;
    }

    .btn-edit {
      background-color: #12282a;
      color: #03dac6;
      border: 1px solid #03dac6;
      padding: 6px 12px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>HERMES</h1>
  </header>

  <main>
    <section class="controls-card">
      <div class="btn-group">
        <button id="btn-start" class="btn-record">Grabar</button>
        <button id="btn-stop" class="btn-stop" disabled>Detener</button>
      </div>
      <div id="live-transcript" class="transcription-box">
        Transcripcion en tiempo real...
      </div>
    </section>

    <section class="list-container">
      <h2>Grabaciones Guardadas</h2>
      <div id="recordings-list" class="recordings-list">
        <!-- Las grabaciones guardadas se renderizaran dinamicamente aqui -->
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
