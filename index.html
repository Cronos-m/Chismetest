<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  
  <!-- FAVICON Y PWA ICON -->
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  
  <title>Hermes - Control y Susurro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #000; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
    
    /* MENÚ PRINCIPAL */
    #main-menu { display: flex; flex-direction: column; gap: 20px; width: 90%; max-width: 400px; padding: 20px; text-align: center; }
    .app-logo { width: 120px; height: 120px; margin: 0 auto; object-fit: contain; border-radius: 25px; box-shadow: 0 4px 15px rgba(255,255,255,0.1); }
    .app-title { font-size: 2.5rem; font-weight: 800; text-align: center; margin-bottom: 10px; letter-spacing: 2px; }
    .btn { padding: 18px; border: none; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: #fff; color: #000; }
    .btn-secondary { background: #1a1a1a; color: #fff; border: 1px solid #333; }
    
    /* PANTALLA SUSURRO */
    #whisper-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; z-index: 10; }
    #whisper-screen.active { display: flex; }
    
    /* FRASE EN VIVO */
    .live-phrase { font-size: clamp(2rem, 5vw, 3rem); font-weight: 900; color: #fff; text-transform: uppercase; text-align: center; min-height: 100px; letter-spacing: 1px; line-height: 1.2; display: flex; align-items: center; justify-content: center; width: 100%; max-width: 800px; }
    .status-indicator { font-size: 1rem; color: #555; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 4px; }
    
    /* LISTA DE FRASES */
    .words-container { margin-top: 20px; width: 100%; max-width: 600px; max-height: 50vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .word-item { font-size: clamp(1.2rem, 3vw, 1.5rem); color: #ccc; border-bottom: 1px solid #222; padding-bottom: 10px; display: flex; align-items: flex-start; gap: 10px; }
    .word-num { color: #fff; font-weight: 900; min-width: 40px; }
    .word-text { flex: 1; text-transform: uppercase; line-height: 1.3; }
    
    /* CONTROLES FLOTANTES */
    .controls { position: absolute; bottom: 30px; display: flex; gap: 15px; background: #111; padding: 12px 25px; border-radius: 40px; border: 1px solid #333; flex-wrap: wrap; justify-content: center; }
    .ctrl-btn { background: none; border: none; color: #fff; font-size: clamp(0.8rem, 2vw, 1rem); font-weight: 600; cursor: pointer; padding: 8px 12px; }
    .ctrl-btn.active-btn { color: #4ade80; }
    .ctrl-btn.paused-btn { color: #f87171; }
    
    /* PANTALLA GUARDADOS */
    #saved-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; display: none; flex-direction: column; align-items: center; padding: 30px 20px; z-index: 20; }
    #saved-screen.active { display: flex; }
    .saved-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; height: 100%; }
    .saved-list { margin-top: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; flex-grow: 1; margin-bottom: 20px; }
    .saved-card { background: #111; padding: 20px; border-radius: 12px; border: 1px solid #333; }
    .saved-date { color: #888; font-size: 0.9rem; margin-bottom: 10px; border-bottom: 1px solid #222; padding-bottom: 5px; }
    .saved-phrase-item { color: #ccc; margin-bottom: 6px; text-transform: uppercase; font-size: 1.1rem; }
  </style>
</head>
<body>

  <!-- MENÚ -->
  <div id="main-menu">
    <img src="icon.png" alt="Hermes Logo" class="app-logo">
    <h1 class="app-title">HERMES</h1>
    <button class="btn btn-primary" onclick="startWhisper()">VER SUSURRO</button>
    <button class="btn btn-secondary" onclick="showSaved()">LISTAS GUARDADAS</button>
  </div>

  <!-- SUSURRO -->
  <div id="whisper-screen">
    <div class="status-indicator" id="status-text">ESCUCHANDO...</div>
    <div class="live-phrase" id="live-phrase"></div>
    <div class="words-container" id="words-list"></div>
    
    <div class="controls">
      <button class="ctrl-btn paused-btn" id="btn-pause" onclick="togglePause()">PAUSAR</button>
      <button class="ctrl-btn" onclick="saveCurrentList()">GUARDAR</button>
      <button class="ctrl-btn" onclick="exitWhisper()">SALIR</button>
    </div>
  </div>

  <!-- GUARDADOS -->
  <div id="saved-screen">
    <div class="saved-container">
      <h2 style="font-size: 1.8rem; text-align: center;">HISTORIAL</h2>
      <div class="saved-list" id="saved-list-container"></div>
      <button class="btn btn-secondary" style="width: 100%;" onclick="hideSaved()">VOLVER AL MENÚ</button>
    </div>
  </div>

  <script>
    let recognition;
    let isPaused = false;
    let phraseCount = 0;
    let currentSessionPhrases = [];
    let lastDisplayedText = "";

    const livePhraseEl = document.getElementById('live-phrase');
    const wordsListEl = document.getElementById('words-list');
    const statusTextEl = document.getElementById('status-text');
    const btnPause = document.getElementById('btn-pause');

    function initSpeech() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Tu navegador no soporta reconocimiento de voz. Usa Chrome, Edge o Safari.");
        return;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true; 
      recognition.maxAlternatives = 1;
      recognition.lang = 'es-ES';

      recognition.onresult = (event) => {
        if (isPaused) return;

        let interimText = '';
        let finalText = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalText += event.results[i][0].transcript;
          } else {
            interimText += event.results[i][0].transcript;
          }
        }

        let displayPhrase = (finalText || interimText).trim().toUpperCase();
        
        if (displayPhrase && displayPhrase !== lastDisplayedText) {
          livePhraseEl.textContent = displayPhrase;
          lastDisplayedText = displayPhrase;
        }

        if (finalText) {
          let cleanFinal = finalText.trim().toUpperCase();
          if (cleanFinal) {
            addPhraseToList(cleanFinal);
            livePhraseEl.textContent = '';
            lastDisplayedText = '';
          }
        }
      };

      recognition.onend = () => {
        if (!isPaused) recognition.start();
      };
    }

    function addPhraseToList(phrase) {
      if (!phrase) return;
      phraseCount++;
      currentSessionPhrases.push(phrase);
      
      const item = document.createElement('div');
      item.className = 'word-item';
      item.innerHTML = `<span class="word-num">${phraseCount}.</span><span class="word-text">${phrase}</span>`;
      
      wordsListEl.prepend(item);
    }

    function startWhisper() {
      document.getElementById('main-menu').style.display = 'none';
      document.getElementById('whisper-screen').classList.add('active');
      
      phraseCount = 0;
      currentSessionPhrases = [];
      wordsListEl.innerHTML = '';
      livePhraseEl.textContent = '';
      isPaused = false;
      updatePauseUI();

      if (!recognition) initSpeech();
      try { recognition.start(); } catch (e) {}
    }

    function togglePause() {
      isPaused = !isPaused;
      updatePauseUI();
      if (isPaused) {
        recognition.stop();
        livePhraseEl.textContent = 'PAUSADO';
      } else {
        livePhraseEl.textContent = '';
        try { recognition.start(); } catch (e) {}
      }
    }

    function updatePauseUI() {
      statusTextEl.textContent = isPaused ? "MICRÓFONO APAGADO" : "ESCUCHANDO...";
      btnPause.textContent = isPaused ? "REANUDAR" : "PAUSAR";
      btnPause.className = isPaused ? "ctrl-btn active-btn" : "ctrl-btn paused-btn";
    }

    function exitWhisper() {
      isPaused = true;
      if (recognition) recognition.stop();
      document.getElementById('whisper-screen').classList.remove('active');
      document.getElementById('main-menu').style.display = 'flex';
    }

    function saveCurrentList() {
      if (currentSessionPhrases.length === 0) {
        alert("No hay frases para guardar.");
        return;
      }
      
      const history = JSON.parse(localStorage.getItem('hermes_history') || '[]');
      history.push({
        date: new Date().toLocaleString(),
        phrases: [...currentSessionPhrases]
      });
      
      localStorage.setItem('hermes_history', JSON.stringify(history));
      alert("Lista guardada exitosamente.");
    }

    function showSaved() {
      const history = JSON.parse(localStorage.getItem('hermes_history') || '[]');
      const container = document.getElementById('saved-list-container');
      container.innerHTML = '';

      if (history.length === 0) {
        container.innerHTML = '<div class="saved-card" style="text-align:center;">No hay listas guardadas</div>';
      } else {
        history.slice().reverse().forEach(session => {
          const card = document.createElement('div');
          card.className = 'saved-card';
          let phrasesHTML = session.phrases.map((p, i) => `<div class="saved-phrase-item">${i + 1}. ${p}</div>`).join('');
          card.innerHTML = `<div class="saved-date">${session.date}</div><div>${phrasesHTML}</div>`;
          container.appendChild(card);
        });
      }

      document.getElementById('main-menu').style.display = 'none';
      document.getElementById('saved-screen').classList.add('active');
    }

    function hideSaved() {
      document.getElementById('saved-screen').classList.remove('active');
      document.getElementById('main-menu').style.display = 'flex';
    }
  </script>
</body>
</html>
