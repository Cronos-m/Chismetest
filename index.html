<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermes - Transcriptor de Audio</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1e1e">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 { text-align: center; }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #bb86fc;
            color: #121212;
            font-weight: bold;
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        #transcription {
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 5px;
            min-height: 100px;
            border: 1px solid #333;
            margin-bottom: 20px;
            white-space: pre-wrap;
        }
        audio {
            width: 100%;
            margin-top: 10px;
        }
        .status {
            text-align: center;
            color: #03dac6;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <h1>Hermes</h1>
    
    <p class="status" id="status">Sistema listo. Presiona Iniciar.</p>
    
    <div class="controls">
        <button id="btnStart">Iniciar Grabación</button>
        <button id="btnStop" disabled>Detener Grabación</button>
    </div>

    <h3>Transcripción en tiempo real:</h3>
    <div id="transcription">El texto transcrito aparecerá aquí...</div>

    <h3>Reproducción de audio amplificado:</h3>
    <audio id="audioPlayback" controls></audio>

    <script src="app.js"></script>
</body>
</html>
